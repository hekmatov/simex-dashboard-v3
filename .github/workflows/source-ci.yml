name: Source CI

on:
  push:

permissions:
  contents: read

jobs:
  source:
    name: Source checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Prepare report directory
        if: steps.install.outcome == 'success'
        run: |
          node -e "require('node:fs').mkdirSync('reports', { recursive: true })"

      - name: Build source application
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm build

      - name: Install Chromium and system dependencies (Ubuntu)
        if: runner.os == 'Linux' && steps.install.outcome == 'success'
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows' && steps.install.outcome == 'success'
        run: node node_modules/@playwright/test/cli.js install chromium

      - name: Unit tests
        id: unit
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/unit-junit.xml

      - name: Source Chromium companion journeys
        id: browser_companion
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/source-companion-junit.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/companion
          PLAYWRIGHT_HTML_OPEN: never
        run: node node_modules/@playwright/test/cli.js test tests/e2e/quorum-companion.spec.js tests/e2e/static-image-audience.spec.js --project=chromium --workers=1 --reporter=list,junit,html

      - name: Source Chromium parallel journeys
        id: browser_parallel
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/source-parallel-junit.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/parallel
          PLAYWRIGHT_HTML_OPEN: never
        run: node node_modules/@playwright/test/cli.js test --config=playwright.source-parallel.config.js --project=chromium --reporter=list,junit,html

      - name: Upload native test reports and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-ci-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when any source check failed
        if: always() && steps.install.outcome == 'success' && (steps.unit.outcome != 'success' || steps.build.outcome != 'success' || steps.browser_companion.outcome != 'success' || steps.browser_parallel.outcome != 'success')
        run: node -e "process.exit(1)"
