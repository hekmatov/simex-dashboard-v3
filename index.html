<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#043bcb" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/pdpc-mark.png" />
    <title>SimEx Dashboard V2</title>
    <script src="%BASE_URL%vendor/three.min.js"></script>
    <script src="%BASE_URL%vendor/vanta.net.min.js"></script>
    <script>
      if (window.location.port === "5173" && "serviceWorker" in navigator) {
        Promise.all([
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister()))),
          "caches" in window
            ? caches.keys().then((keys) => Promise.all(
                keys
                  .filter((key) => key.startsWith("simex-dashboard"))
                  .map((key) => caches.delete(key)),
              ))
            : Promise.resolve(),
        ]).then(() => {
          if (navigator.serviceWorker.controller) window.location.reload();
        });
      }
      if (window.location.protocol === "file:") {
        document.write('<script src="%BASE_URL%portable-dashboard-data.js"><\/script>');
      }
    </script>
  </head>
  <body>
    <div id="vanta-background"></div>
    <div id="root"></div>
    <script type="module" src="%BASE_URL%src/main.jsx"></script>
  </body>
</html>
