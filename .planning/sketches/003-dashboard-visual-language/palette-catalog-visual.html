<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sketch 003 · Visual palette catalogue</title>
  <style>
    :root {
      color-scheme: light dark;
      --matte: #7a7a7a;
      --micro-gap: 4px;
      --appearance-gap: 14px;
      --pair-gap: 30px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--matte);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--matte);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .reference-area,
    .gallery {
      width: min(100%, 2040px);
      margin: 0 auto;
      padding-inline: clamp(14px, 2vw, 32px);
    }

    .reference-area {
      padding-top: clamp(14px, 2vw, 32px);
    }

    .reference-scroll {
      width: 100%;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
    }

    .reference-scroll:focus-visible {
      outline: 3px solid #000000;
      outline-offset: 3px;
    }

    .reference-composition {
      display: grid;
      gap: var(--micro-gap);
      width: min(100%, 900px);
      min-width: 680px;
      margin-inline: auto;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--pair-gap);
      padding-block: clamp(14px, 2vw, 32px);
    }

    .palette-pair,
    .appearance {
      min-width: 0;
      margin: 0;
      padding: 0;
    }

    .palette-pair {
      display: grid;
      gap: var(--appearance-gap);
      align-content: start;
    }

    .appearance {
      display: grid;
      gap: var(--micro-gap);
    }

    .palette-name {
      margin: 0;
      padding: 0;
      color: #000000;
      background: transparent;
      font: 700 19px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: left;
      letter-spacing: 0;
    }

    .treemap {
      display: grid;
      grid-template-rows: 34fr 32fr;
      gap: var(--micro-gap);
      width: 100%;
      aspect-ratio: 200 / 99;
      overflow: hidden;
      background: var(--matte);
    }

    .major,
    .detail,
    .text-group,
    .frame-group,
    .control-group,
    .state-group,
    .frame-row,
    .control-row,
    .state-row,
    .series {
      display: grid;
      min-width: 0;
      min-height: 0;
      gap: var(--micro-gap);
    }

    .major {
      grid-template-columns: 8fr 20fr 32fr 8fr;
    }

    .detail {
      grid-template-columns: 10fr 8.5fr 7.25fr 6.25fr;
    }

    .text-group {
      grid-template-rows: 5fr 3fr 2fr;
    }

    .frame-group {
      grid-template-rows: 4.5fr 4fr;
    }

    .frame-row:first-child {
      grid-template-columns: 3fr 1.5fr;
    }

    .frame-row:last-child {
      grid-template-columns: 2.5fr 1.5fr;
    }

    .control-group {
      grid-template-rows: 3.5fr 2.5fr 1.25fr;
    }

    .control-row:first-child {
      grid-template-columns: 2fr 1.5fr;
    }

    .control-row:nth-child(2) {
      grid-template-columns: 0.75fr 1fr 0.75fr;
    }

    .control-row:last-child {
      grid-template-columns: 1fr;
    }

    .state-group {
      grid-template-rows: repeat(5, 1fr);
    }

    .state-row {
      grid-template-columns: 0.5fr 0.75fr;
    }

    .series {
      grid-template-columns: repeat(6, minmax(0, 1fr));
      height: clamp(52px, 5.2vw, 84px);
      background: var(--matte);
    }

    .tile,
    .series-tile {
      display: block;
      min-width: 0;
      min-height: 0;
      background: var(--swatch);
    }

    .reference-tile,
    .reference-series-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 3px;
      color: var(--reference-ink);
      font: 700 clamp(10px, 0.8vw, 13px)/1.05 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      overflow-wrap: anywhere;
    }

    @media (min-width: 1080px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1740px) {
      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      :root {
        --micro-gap: 3px;
        --appearance-gap: 10px;
        --pair-gap: 22px;
      }

      .reference-area,
      .gallery {
        padding-inline: 10px;
      }

      .reference-area {
        padding-top: 10px;
      }

      .gallery {
        padding-block: 10px;
      }

      .series {
        height: 46px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }

    @media print {
      @page {
        size: letter portrait;
        margin: 0.25in;
      }

      html,
      body {
        width: auto;
        min-width: 0;
        background: #ffffff;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .reference-area,
      .gallery {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
      }

      .reference-area {
        break-after: page;
        page-break-after: always;
      }

      .reference-scroll {
        overflow: visible;
      }

      .reference-composition {
        width: 100%;
        min-width: 0;
        max-width: none;
        margin: 0;
      }

      .gallery {
        display: block;
      }

      .palette-pair {
        width: 100%;
        break-inside: avoid;
        page-break-inside: avoid;
        break-after: page;
        page-break-after: always;
      }

      .palette-pair:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      .appearance,
      .treemap,
      .series {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

                "colors": "#161319 #172126 #22272c #251f28 #f1eadb #c8c0b2 #aaa599 #666873 #afb4b2 #e0abd6 #4b3048 #271624 #75d0cf #e898bf #4c2b3e #bdabf0 #3b3455 #7ec7d9 #243e46 #8bc69e #293f34 #e7bd68 #493b25 #f09ba4 #4a2c32 #434a4d #e9e0cf #4dc2c3 #f09b5a #ad8de1 #8dc786 #e47eaf #d5b750"
        },
        {
                "id": "dark-luminance-ladder",
                "name": "Luminance Ladder",
                "colors": "#150d1b #1e1528 #2a2034 #241a2e #fff4df #d6c4db #b19db9 #594a64 #c0a9ca #d8a4f1 #4a2d5c #24102d #73d5ed #ff86c1 #553044 #6fe0ca #254a44 #a8bcef #334060 #93d69b #2e4934 #f4c55a #51411c #ff9aa7 #58303a #493d52 #fff2dc #1db1f1 #d41e7f #acee96 #db5716 #cbb5f0 #a7930b"
        },
        {
                "id": "dark-sunrise-reference-faithful",
                "name": "Sunrise — Reference faithful",
                "colors": "#160F14 #21171E #2C2028 #251A21 #FFF1E8 #D8C0C9 #B7A0A9 #66515B #C0A6B0 #FF9D4D #55301A #2A1303 #9FC0FF #FF8D76 #5B302C #D5A6F3 #493558 #A7C4FF #2F3B55 #9BCB9D #314538 #FFD080 #51401F #FFA192 #58302F #5A4650 #FFF0E6 #FF9A3D #F06A4A #D65C6A #B879E3 #7E95FF #9ACBFF"
        },
        {
                "id": "dark-lakeside-reference-faithful",
                "name": "Lakeside — Reference faithful",
                "colors": "#0E1515 #14201F #1C2B28 #182421 #EFF8F2 #C2D0CB #9FAFA9 #435954 #94AAA3 #83AEFF #293F65 #10203A #84DDEB #7CCAD6 #26464A #A8D88E #35472D #93B7FF #2B3B5C #A4D58D #34482F #E5C36A #4B4022 #F1A0A7 #502F35 #3D514C #EDF8F1 #6F91F2 #64ACEF #78D1E5 #9ADE88 #9FC68A #B5C996"
        },
        {
                "id": "dark-monochrome-reserve",
                "name": "Monochrome Reserve",
                "colors": "#0d0d0d #171717 #222222 #2c2c2c #f5f5f5 #cacaca #ababab #757575 #b9b9b9 #f0f0f0 #3c3c3c #171717 #ffffff #f0f0f0 #414141 #d7d7d7 #363636 #cacaca #303030 #e7e7e7 #3d3d3d #d0d0d0 #333333 #fafafa #454545 #4a4a4a #ededed #78a9e0 #e88498 #70b985 #b695de #c9a84f #60bdc1"
        }
];

      const referenceLabels = [
        'Outer', 'Canvas', 'Panel', 'Alternate',
        'Ink', 'Soft', 'Faint',
        'Rule', 'Strong',
        'Accent', 'Soft', 'On accent', 'Focus', 'Selected', 'Selected soft',
        'Chrono', 'Soft', 'Info', 'Soft', 'Success', 'Soft',
        'Warning', 'Soft', 'Error', 'Soft', 'Grid', 'Mark'
      ];

      const referenceColors = [
        '#b6b6b6', '#d4d4d4', '#f0f0f0', '#c6c6c6',
        '#2d2d2d', '#565656', '#7c7c7c',
        '#a0a0a0', '#606060',
        '#858585', '#bcbcbc', '#e6e6e6', '#484848', '#989898', '#d0d0d0',
        '#555555', '#c5c5c5', '#6c6c6c', '#d0d0d0', '#7d7d7d', '#d8d8d8',
        '#909090', '#e0e0e0', '#a3a3a3', '#e8e8e8', '#dadada', '#3e3e3e'
      ];

      const referenceSeriesColors = [
        '#242424', '#4c4c4c', '#747474', '#9c9c9c', '#c4c4c4', '#ececec'
      ];

      const gallery = document.getElementById('gallery');
      const referenceComposition = document.getElementById('reference-composition');

      function readableInk(color) {
        const value = Number.parseInt(color.slice(1, 3), 16) / 255;
        const linear = value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
        return linear > 0.179 ? '#000000' : '#ffffff';
      }

      function swatch(color, label, weight, className = 'tile') {
        const item = document.createElement('span');
        item.className = className;
        item.style.setProperty('--swatch', color);
        item.setAttribute('role', 'img');
        item.setAttribute('aria-label', weight === null
          ? label + ': ' + color
          : label + ': ' + color + '; ' + weight + ' percent of the surface and UI map');
        return item;
      }

      function referenceSwatch(index) {
        const item = swatch(referenceColors[index], tokens[index][0], tokens[index][1], 'tile reference-tile');
        item.style.setProperty('--reference-ink', readableInk(referenceColors[index]));
        item.textContent = referenceLabels[index];
        return item;
      }

      function group(className, children) {
        const container = document.createElement('div');
        container.className = className;
        children.forEach((child) => container.append(child));
        return container;
      }

      function renderTopology(tile) {
        const major = group('major', [tile(0), tile(1), tile(2), tile(3)]);
        const text = group('text-group', [tile(4), tile(5), tile(6)]);
        const frame = group('frame-group', [
          group('frame-row', [tile(7), tile(8)]),
          group('frame-row', [tile(25), tile(26)])
        ]);
        const controls = group('control-group', [
          group('control-row', [tile(9), tile(10)]),
          group('control-row', [tile(11), tile(12), tile(13)]),
          group('control-row', [tile(14)])
        ]);
        const states = group('state-group', [
          group('state-row', [tile(15), tile(16)]),
          group('state-row', [tile(17), tile(18)]),
          group('state-row', [tile(19), tile(20)]),
          group('state-row', [tile(21), tile(22)]),
          group('state-row', [tile(23), tile(24)])
        ]);
        return group('treemap', [
          major,
          group('detail', [text, frame, controls, states])
        ]);
      }

      function renderReference() {
        referenceComposition.append(renderTopology(referenceSwatch));
        const series = group('series', referenceSeriesColors.map((color, index) => {
          const item = swatch(color, 'chart series ' + (index + 1), null, 'series-tile reference-series-tile');
          item.style.setProperty('--reference-ink', readableInk(color));
          item.textContent = 'D' + (index + 1);
          return item;
        }));
        referenceComposition.append(series);
      }

      function renderAppearance(record, scheme) {
        const colors = record.colors.split(' ');
        const appearance = document.createElement('section');
        appearance.className = 'appearance';
        appearance.setAttribute('aria-label', record.name + ', ' + scheme + ' appearance');

        const heading = document.createElement('h3');
        heading.className = 'palette-name';
        heading.textContent = record.name + ' (' + scheme + ')';
        appearance.append(heading);

        appearance.append(renderTopology((index) =>
          swatch(colors[index], tokens[index][0], tokens[index][1])));

        const series = group('series', colors.slice(27).map((color, index) =>
          swatch(color, 'chart series ' + (index + 1), null, 'series-tile')));
        appearance.append(series);
        return appearance;
      }

      renderReference();

      for (let index = 0; index < 15; index += 1) {
        const light = appearances[index];
        const dark = appearances[index + 15];
        const pair = document.createElement('article');
        pair.className = 'palette-pair';
        pair.setAttribute('aria-label', light.name + ' palette pair; Light above Dark');

        const heading = document.createElement('h2');
        heading.className = 'sr-only';
        heading.textContent = light.name;
        pair.append(heading, renderAppearance(light, 'Light'), renderAppearance(dark, 'Dark'));
        gallery.append(pair);
      }
    })();
  </script>
</body>
</html>
