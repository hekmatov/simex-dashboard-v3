<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sketch 012 · Temporal content library</title>
  <style>
    :root {
      color-scheme: light;
      --review-bg: #0b1118;
      --review-panel: #121b25;
      --review-rule: #2c3a48;
      --review-ink: #eef5f7;
      --review-muted: #a8b8c5;
      --review-accent: #8fc8a9;
      --out: #eee9de;
      --canvas: #f7f2e8;
      --panel: #fffdf8;
      --alt: #faf6ec;
      --ink: #1d2529;
      --muted: #555a55;
      --faint: #716d64;
      --rule: #b7b0a2;
      --rule-strong: #655f55;
      --accent: #2c383d;
      --accent-soft: #e3e6e3;
      --focus: #176f76;
      --selected: #8a3e46;
      --selected-soft: #f1dddc;
      --attention: #9a3e47;
      --attention-soft: #f3dadd;
      --ready: #376c57;
      --ready-soft: #dbe9dd;
      --warning: #875a12;
      --warning-soft: #f4e4bb;
      --info: #246579;
      --info-soft: #d7e7e8;
      --shadow: 0 24px 64px rgba(18, 16, 12, .3);
      --ui: "Segoe UI", Arial, sans-serif;
      --editorial: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--review-bg);
      color: var(--review-ink);
      font: 15px/1.45 var(--ui);
    }
    button, input, select { font: inherit; }
    button, select, input { color: inherit; }
    button { cursor: pointer; }
    button[disabled] { cursor: not-allowed; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .prototype {
      display: grid;
      grid-template-columns: clamp(320px, 22vw, 410px) minmax(0, 1fr);
      height: 100%;
      min-width: 0;
    }
    .review-rail {
      overflow-y: auto;
      border-right: 1px solid var(--review-rule);
      background: linear-gradient(180deg, #0e1721, var(--review-bg));
      padding: 22px;
    }
    .review-kicker {
      margin: 0 0 6px;
      color: var(--review-accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .review-rail h1 {
      margin: 0;
      max-width: 15ch;
      font: 700 30px/1.04 var(--editorial);
    }
    .review-summary {
      margin: 12px 0 20px;
      color: var(--review-muted);
    }
    .review-block {
      margin-top: 18px;
      padding-top: 17px;
      border-top: 1px solid var(--review-rule);
    }
    .review-block h2 {
      margin: 0 0 10px;
      color: var(--review-muted);
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .review-stack { display: grid; gap: 8px; }
    .review-button {
      min-height: 46px;
      width: 100%;
      border: 1px solid #394b5d;
      border-radius: 6px;
      background: var(--review-panel);
      padding: 10px 12px;
      color: var(--review-ink);
      text-align: left;
      transition: border-color .14s ease, background .14s ease;
    }
    .review-button:hover { border-color: #70869a; }
    .review-button[aria-pressed="true"] {
      border-color: var(--review-accent);
      box-shadow: inset 3px 0 var(--review-accent);
      background: #17251f;
    }
    .review-button strong, .review-button span { display: block; }
    .review-button span { margin-top: 2px; color: var(--review-muted); font-size: 12px; }
    .review-inline { display: flex; flex-wrap: wrap; gap: 8px; }
    .review-inline .review-button { width: auto; flex: 1 1 76px; text-align: center; }
    .review-note {
      border: 1px solid #304151;
      border-radius: 6px;
      background: rgba(255,255,255,.035);
      padding: 12px;
      color: var(--review-muted);
      font-size: 13px;
    }
    .stage {
      min-width: 0;
      overflow: auto;
      padding: 24px;
      background:
        radial-gradient(circle at 70% 10%, rgba(80, 104, 120, .22), transparent 30%),
        #090e14;
    }
    .viewport-frame {
      display: flex;
      min-width: min-content;
      min-height: 100%;
      align-items: flex-start;
      justify-content: center;
    }
    .product-window {
      container: product / inline-size;
      position: relative;
      width: var(--vw, 100%);
      height: var(--vh, calc(100vh - 48px));
      min-width: 0;
      overflow: hidden;
      border: 1px solid #526372;
      border-radius: 12px;
      background: var(--canvas);
      color: var(--ink);
      box-shadow: 0 32px 84px rgba(0,0,0,.46);
    }
    .product-window.fit {
      width: 100%;
      min-width: 760px;
      height: calc(100vh - 48px);
      min-height: 700px;
    }
    .product-scroll {
      position: relative;
      height: 100%;
      overflow: auto;
      background: var(--canvas);
    }

    .unsupported-banner {
      position: sticky;
      top: 0;
      z-index: 90;
      display: flex;
      min-height: 52px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 2px solid #f0a3a3;
      background: #7b2e2e;
      padding: 8px 14px;
      color: #fff;
      font-weight: 700;
    }
    .unsupported-banner button {
      min-height: 36px;
      border: 1px solid #fff;
      border-radius: 4px;
      background: #fff;
      padding: 6px 10px;
      color: #612326;
      font-weight: 800;
    }
    .command-crown {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--panel);
    }
    .phone .command-crown { top: 52px; }
    .modebar, .context-row, .build-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--rule);
      padding: 7px 18px;
    }
    .modebar { min-height: 52px; background: var(--accent); color: #fff; }
    .identity { display: flex; align-items: center; gap: 9px; margin-right: auto; font-weight: 800; }
    .identity-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.65);
      font-size: 12px;
      letter-spacing: .08em;
    }
    .mode-actions { display: flex; gap: 6px; }
    .mode-button {
      min-height: 38px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 3px;
      background: transparent;
      padding: 6px 13px;
      color: #fff;
    }
    .mode-button[aria-pressed="true"] {
      border-color: #fff;
      background: rgba(255,255,255,.16);
      font-weight: 800;
    }
    .context-row { min-height: 58px; background: var(--panel); }
    .dashboard-name { font: 700 18px/1.2 var(--editorial); }
    .page-nav { display: flex; gap: 5px; margin-left: auto; }
    .page-button, .strip-button {
      min-height: 40px;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--alt);
      padding: 7px 12px;
      color: var(--ink);
    }
    .page-button[aria-current="page"] {
      border-color: var(--rule-strong);
      background: var(--panel);
      font-weight: 800;
    }
    .build-strip { min-height: 52px; background: var(--alt); }
    .strip-label { margin-right: auto; color: var(--muted); }
    .strip-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 800;
    }
    .strip-button[aria-pressed="true"] {
      box-shadow: inset 0 -3px var(--selected);
      background: var(--panel);
      font-weight: 800;
    }

    .dashboard-canvas {
      min-height: 900px;
      padding: 24px;
      background: var(--canvas);
    }
    .dashboard-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 6px 0 22px;
    }
    .dashboard-heading h2, .section-heading h3, .chart-card h4 {
      font-family: var(--editorial);
    }
    .dashboard-heading h2 { margin: 0; font-size: 25px; }
    .dashboard-heading p { margin: 4px 0 0; color: var(--muted); }
    .section-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 26px;
      border-bottom: 2px solid var(--rule-strong);
      padding-bottom: 9px;
    }
    .section-heading h3 { margin: 0 auto 0 0; font-size: 20px; }
    .section-heading button {
      min-height: 36px;
      border: 1px solid var(--rule);
      background: var(--panel);
      color: var(--muted);
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .chart-card {
      min-height: 190px;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--panel);
      padding: 13px;
    }
    .chart-card.wide { grid-column: span 2; }
    .chart-card h4 { margin: 0 0 4px; font-size: 16px; }
    .chart-card p { margin: 0; color: var(--muted); font-size: 12px; }
    .mini-chart {
      display: flex;
      height: 104px;
      align-items: end;
      gap: 8px;
      margin-top: 14px;
      border-left: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      padding: 7px 8px 0;
    }
    .mini-chart span { flex: 1; background: #687b6a; opacity: .85; }

    .library-backdrop {
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(36, 34, 29, .14);
    }
    .library-layer {
      position: absolute;
      inset: 22px;
      z-index: 70;
      display: grid;
      grid-template-rows: auto auto auto minmax(0,1fr) auto;
      overflow: hidden;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .library-header {
      display: flex;
      align-items: start;
      gap: 18px;
      border-bottom: 1px solid var(--rule);
      padding: 18px 20px 15px;
    }
    .library-title { margin-right: auto; }
    .library-kicker {
      margin: 0 0 3px;
      color: var(--selected);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .library-title h2 { margin: 0; font: 700 25px/1.1 var(--editorial); }
    .library-title p { margin: 5px 0 0; color: var(--muted); }
    .library-header .header-actions { display: flex; gap: 8px; }
    .library-header button, .library-footer button, .filter-bar button {
      min-height: 42px;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--alt);
      padding: 8px 12px;
      color: var(--ink);
    }
    .library-header .primary, .filter-bar .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 800;
    }
    .library-subhead {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--rule);
      background: var(--alt);
      padding: 7px 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .variant-name { color: var(--ink); font-weight: 800; }
    .draft-chip {
      margin-left: auto;
      border: 1px solid var(--warning);
      background: var(--warning-soft);
      padding: 4px 8px;
      color: #553700;
      font-weight: 800;
    }
    .filter-bar {
      display: grid;
      grid-template-columns: minmax(220px, 1.6fr) minmax(145px,.6fr) minmax(180px,.8fr) auto;
      gap: 10px;
      border-bottom: 1px solid var(--rule);
      padding: 12px 20px;
    }
    .field { display: grid; gap: 4px; }
    .field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .field input, .field select {
      min-height: 42px;
      width: 100%;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: #fff;
      padding: 7px 10px;
      color: var(--ink);
    }
    .filter-action { align-self: end; }
    .library-scroll {
      min-height: 0;
      overflow: auto;
      padding: 18px 20px 28px;
      scroll-padding-top: 12px;
    }
    .library-footer {
      display: flex;
      min-height: 50px;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--rule);
      background: var(--alt);
      padding: 8px 20px;
      color: var(--muted);
    }
    .library-footer strong { color: var(--ink); }
    .library-footer button { margin-left: auto; }

    .summary-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .count-chip, .page-chip, .parent-chip, .status-pill {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--alt);
      color: var(--ink);
      font: 700 12px/1 var(--ui);
    }
    .status-pill.ready { border-color: var(--ready); background: var(--ready-soft); color: #244b3b; }
    .status-pill.attention { border-color: var(--attention); background: var(--attention-soft); color: #6d2831; }
    .status-pill.empty { border-color: var(--info); background: var(--info-soft); color: #1c4f5e; }

    .ledger { display: grid; gap: 12px; }
    .group-record {
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--panel);
    }
    .group-record.selected { border-color: var(--selected); box-shadow: inset 4px 0 var(--selected); }
    .group-record.attention { border-color: #c08186; }
    .group-head {
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 14px;
    }
    .disclosure {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--alt);
      color: var(--ink);
      font-size: 18px;
    }
    .record-title {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--ink);
      text-align: left;
    }
    .record-title strong {
      display: block;
      font: 700 18px/1.2 var(--editorial);
    }
    .record-title span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; }
    .record-metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }
    .record-actions, .scene-actions, .queue-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }
    .action-button {
      min-height: 38px;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--alt);
      padding: 6px 9px;
      color: var(--ink);
      font-size: 13px;
    }
    .action-button:hover { border-color: var(--rule-strong); background: #fff; }
    .action-button.danger { border-color: #c48c90; color: #7b2e36; }
    .action-button.repair { border-color: var(--attention); background: var(--attention-soft); color: #6d2831; font-weight: 800; }
    .action-button[aria-disabled="true"] {
      opacity: .58;
      background: #eeeae1;
      cursor: not-allowed;
    }
    .group-details {
      border-top: 1px solid var(--rule);
      background: var(--alt);
      padding: 14px 14px 16px 68px;
    }
    .issue-list { display: grid; gap: 8px; margin-bottom: 12px; }
    .issue-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 12px;
      align-items: center;
      border-left: 4px solid var(--attention);
      background: var(--attention-soft);
      padding: 10px 12px;
    }
    .issue-row strong, .issue-row span { display: block; }
    .issue-row span { margin-top: 2px; color: #6d4044; font-size: 13px; }
    .scene-list { display: grid; gap: 8px; }
    .scene-card {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--rule);
      background: var(--panel);
      padding: 11px 12px;
    }
    .scene-card.selected { border-color: var(--selected); box-shadow: inset 3px 0 var(--selected); }
    .scene-card h4 { margin: 0; font: 700 16px/1.25 var(--editorial); }
    .scene-card p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .scene-card .record-metadata { margin-top: 6px; }
    .empty-state {
      border: 1px dashed var(--rule-strong);
      background: var(--panel);
      padding: 22px;
      text-align: center;
    }
    .empty-state h3 { margin: 0; font: 700 20px/1.2 var(--editorial); }
    .empty-state p { max-width: 64ch; margin: 7px auto 14px; color: var(--muted); }

    .shelf-layout {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(260px, .34fr);
      gap: 16px;
    }
    .page-shelf, .group-rail, .ready-catalogue, .attention-queue {
      border: 1px solid var(--rule);
      background: var(--alt);
      padding: 14px;
    }
    .shelf-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .shelf-tab {
      min-height: 40px;
      border: 1px solid var(--rule);
      background: var(--panel);
      color: var(--ink);
    }
    .shelf-tab[aria-pressed="true"] { border-color: var(--selected); box-shadow: inset 0 -3px var(--selected); font-weight: 800; }
    .shelf-heading, .rail-heading, .queue-heading {
      display: flex;
      align-items: end;
      gap: 12px;
      margin-bottom: 10px;
    }
    .shelf-heading h3, .rail-heading h3, .queue-heading h3 {
      margin: 0 auto 0 0;
      font: 700 19px/1.2 var(--editorial);
    }
    .shelf-cards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .shelf-card {
      display: grid;
      min-height: 196px;
      align-content: start;
      border: 1px solid var(--rule);
      background: var(--panel);
      padding: 13px;
    }
    .shelf-card h4 { margin: 9px 0 5px; font: 700 17px/1.22 var(--editorial); }
    .shelf-card p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
    .shelf-card .scene-actions { align-self: end; margin-top: auto; justify-content: flex-start; }
    .group-rail-list { display: grid; gap: 7px; }
    .rail-record {
      border: 1px solid var(--rule);
      background: var(--panel);
      padding: 10px;
    }
    .rail-record strong { display: block; font-family: var(--editorial); }
    .rail-record span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .rail-record .record-actions { justify-content: flex-start; margin-top: 8px; }
    .rail-record.selected { border-color: var(--selected); box-shadow: inset 3px 0 var(--selected); }
    .shelf-relationship {
      grid-column: 1 / -1;
      border: 1px solid var(--rule-strong);
      background: var(--panel);
      padding: 15px;
    }
    .relationship-head {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-start;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--rule);
    }
    .relationship-head > div { flex: 1 1 560px; min-width: 0; }
    .relationship-kicker {
      display: block;
      margin-bottom: 5px;
      color: var(--selected);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .relationship-head h3 { margin: 0; font: 700 22px/1.2 var(--editorial); }
    .relationship-head .record-actions { justify-content: flex-start; margin-top: 10px; }
    .relationship-close { white-space: nowrap; }
    .relationship-pages { display: grid; gap: 12px; margin-top: 13px; }
    .relationship-page {
      border: 1px solid var(--rule);
      background: var(--alt);
      padding: 11px;
    }
    .relationship-page-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
    }
    .relationship-page-head h4 { margin: 0 auto 0 0; font: 700 16px/1.2 var(--editorial); }
    .relationship-page-head span { color: var(--muted); font-size: 12px; }
    .relationship-scenes { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(280px,100%),1fr)); gap: 8px; }
    .relationship-scene {
      display: grid;
      gap: 9px;
      border: 1px solid var(--rule);
      background: var(--panel);
      padding: 11px;
    }
    .relationship-scene.attention { border-color: #c48c90; }
    .relationship-scene h5 { margin: 6px 0 3px; font: 700 15px/1.25 var(--editorial); }
    .relationship-scene p { margin: 0; color: var(--muted); font-size: 12px; }
    .relationship-scene .scene-actions { justify-content: flex-start; }

    .page-grouped-library { display: grid; gap: 12px; }
    .page-group-list { display: grid; gap: 13px; }
    .page-group-block {
      border: 1px solid var(--rule);
      background: var(--alt);
    }
    .page-group-block.elevated { border-color: #b97178; box-shadow: inset 4px 0 var(--attention); }
    .page-group-header {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 14px;
      align-items: start;
      padding: 13px;
      background: var(--panel);
      border-bottom: 1px solid var(--rule);
    }
    .page-group-header h3 { margin: 4px 0 3px; font: 700 19px/1.2 var(--editorial); }
    .page-group-header p { margin: 0; color: var(--muted); font-size: 13px; }
    .page-group-header .record-actions { align-self: center; }
    .priority-label {
      display: inline-block;
      color: #7b3038;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .045em;
      text-transform: uppercase;
    }
    .page-group-scenes {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 9px;
      padding: 11px;
    }
    .page-group-scene {
      display: grid;
      grid-template-rows: auto auto minmax(42px,1fr) auto;
      border: 1px solid var(--rule);
      background: var(--panel);
      padding: 11px;
      min-width: 0;
    }
    .page-group-scene.attention { border-color: #c48c90; box-shadow: inset 0 3px var(--attention); }
    .page-group-scene h4 { margin: 8px 0 4px; font: 700 16px/1.25 var(--editorial); }
    .page-group-scene p { margin: 0; color: var(--muted); font-size: 12px; }
    .page-group-scene .record-metadata { margin: 8px 0; }
    .page-group-scene .scene-actions { justify-content: flex-start; align-self: end; }

    .queue-layout { display: grid; gap: 16px; }
    .attention-queue { border-color: #c48c90; background: #fbf0ee; }
    .queue-list { display: grid; gap: 9px; }
    .queue-item {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 14px;
      border: 1px solid #c99195;
      background: var(--panel);
      padding: 12px;
    }
    .queue-item h4 { margin: 0; font: 700 17px/1.2 var(--editorial); }
    .queue-item p { margin: 4px 0 0; color: var(--muted); }
    .ready-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 9px; }
    .ready-card {
      border: 1px solid var(--rule);
      background: var(--panel);
      padding: 11px;
    }
    .ready-card h4 { margin: 7px 0 4px; font: 700 15px/1.24 var(--editorial); }
    .ready-card p { margin: 0; color: var(--muted); font-size: 12px; }
    .ready-card .record-actions { justify-content: flex-start; margin-top: 8px; }

    .handoff-panel {
      display: grid;
      max-width: 900px;
      margin: 10px auto;
      border: 1px solid var(--rule-strong);
      background: var(--panel);
    }
    .handoff-head { border-bottom: 1px solid var(--rule); background: var(--accent); padding: 18px; color: #fff; }
    .handoff-head p { margin: 0 0 4px; font-size: 12px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
    .handoff-head h3 { margin: 0; font: 700 24px/1.2 var(--editorial); }
    .handoff-body { padding: 22px; }
    .handoff-stage {
      border-left: 4px solid var(--selected);
      background: var(--selected-soft);
      padding: 12px;
    }
    .handoff-stage strong, .handoff-stage span { display: block; }
    .handoff-stage span { margin-top: 3px; color: #63464a; }
    .handoff-proof {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .proof-card { border: 1px solid var(--rule); background: var(--alt); padding: 12px; }
    .proof-card strong { display: block; }
    .proof-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; }
    .handoff-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--rule);
      padding: 12px 18px;
    }
    .handoff-actions button, .modal-actions button {
      min-height: 42px;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--alt);
      padding: 8px 12px;
      color: var(--ink);
    }
    .handoff-actions .primary, .modal-actions .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 800;
    }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: rgba(29, 28, 24, .42);
      padding: 20px;
    }
    .modal {
      width: min(620px, 100%);
      max-height: min(680px, 90%);
      overflow: auto;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .modal-head { border-bottom: 1px solid var(--rule); padding: 17px 18px; }
    .modal-head h3 { margin: 0; font: 700 22px/1.2 var(--editorial); }
    .modal-body { padding: 18px; }
    .modal-body p { margin-top: 0; }
    .consequence-list { margin: 10px 0; border: 1px solid var(--rule); background: var(--alt); padding: 10px 12px 10px 30px; }
    .modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--rule); padding: 12px 18px; }
    .modal-actions .danger { border-color: var(--attention); background: var(--attention); color: #fff; font-weight: 800; }
    .toast {
      position: absolute;
      right: 18px;
      bottom: 64px;
      z-index: 130;
      max-width: 440px;
      border: 1px solid var(--rule-strong);
      background: var(--accent);
      padding: 11px 14px;
      color: #fff;
      box-shadow: 0 10px 26px rgba(0,0,0,.24);
    }
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
      clip: rect(1px,1px,1px,1px) !important;
      white-space: nowrap !important;
    }

    @container product (max-width: 1060px) {
      .library-layer { inset: 12px; }
      .filter-bar { grid-template-columns: 1fr 1fr; }
      .filter-action { align-self: stretch; }
      .shelf-layout { grid-template-columns: 1fr; }
      .group-rail { order: -1; }
      .group-rail-list { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .ready-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .group-head { grid-template-columns: auto minmax(0,1fr); }
      .group-head .record-actions { grid-column: 2; justify-content: flex-start; }
      .chart-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .page-group-scenes { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @container product (max-width: 760px) {
      .library-layer { inset: 6px; }
      .modebar, .context-row, .build-strip { flex-wrap: wrap; padding-inline: 10px; }
      .page-nav { width: 100%; margin-left: 0; overflow-x: auto; }
      .library-header { padding: 13px; }
      .library-header .header-actions { flex-direction: column; }
      .library-title h2 { font-size: 20px; }
      .library-subhead { padding-inline: 13px; }
      .filter-bar { grid-template-columns: 1fr; padding: 10px 13px; }
      .library-scroll { padding: 12px 13px 22px; }
      .group-head, .scene-card, .queue-item { grid-template-columns: 1fr; }
      .page-group-header, .page-group-scenes { grid-template-columns: 1fr; }
      .disclosure { width: 100%; height: 36px; }
      .group-head .record-actions { grid-column: 1; justify-content: flex-start; }
      .group-details { padding-left: 14px; }
      .scene-actions, .queue-actions { justify-content: flex-start; }
      .shelf-cards, .ready-grid, .group-rail-list, .handoff-proof { grid-template-columns: 1fr; }
      .library-footer { align-items: flex-start; flex-direction: column; }
      .library-footer button { margin-left: 0; }
      .chart-grid { grid-template-columns: 1fr; }
      .chart-card.wide { grid-column: span 1; }
    }
    @media (max-width: 760px) {
      .prototype { grid-template-columns: 1fr; }
      .review-rail { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--review-rule); }
      .stage { min-height: 60vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .001ms !important; animation-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (function () {
      "use strict";

      var PAGES = ["Executive surveillance", "Hospital readiness", "Population protection"];
      var BASE_GROUPS = [
        {
          id: "winter",
          name: "Winter response 2026",
          status: "ready",

          frames: 17,

        },
        {

          status: "ready",

          issues: [],
          scenes: [
            { id: "coastal-command", name: "Coastal command briefing", page: "Executive surveillance", status: "ready", charts: 4, frames: 18, issue: "" },
            { id: "coastal-shelter", name: "Shelter and access continuity", page: "Population protection", status: "ready", charts: 3, frames: 12, issue: "" }
          ]
        },
        {
          id: "may-review",
          name: "May 15–31 Multi-agency Readiness Review",
          status: "ready",
          period: "15–31 May 2026",
          charts: 4,
          frames: 17,
          saved: "13 Aug · 12:08",
          issues: [],
          scenes: [
            { id: "may-executive", name: "End-of-month executive readiness", page: "Executive surveillance", status: "ready", charts: 4, frames: 17, issue: "" }
          ]
        },
        {
          id: "may-tempo",
          name: "May Operational Tempo",
          status: "attention",
          period: "15–31 May 2026",
          charts: 5,
          frames: 13,
          saved: "12 Aug · 18:24",
          issues: [
            {
              id: "dialysis",
              title: "Dialysis service continuity has no observations in the saved period",
              detail: "TEMP-FIX-C05 remains selected but has zero valid observations after 15 May.",
              stage: "Sketch 005 · Choose charts",
              focus: "Dialysis service continuity · Needs attention"
            },
            {
              id: "fallback",

        {
