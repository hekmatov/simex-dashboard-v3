          issues: [],
          scenes: []
        },
        {
          id: "cross-page",
          name: "Regional continuity, public warning, temporary accommodation, and critical-service recovery coordination",
          status: "attention",
          period: "1 Apr–31 Jul 2026",
          charts: 7,
          frames: 31,
          saved: "7 Aug · 11:02",
          issues: [],
          scenes: [
            {
              id: "cross-page-scene",
              name: "Regional public-protection briefing with long translated-like operational context",
              page: "Population protection",
              status: "attention",
              charts: 4,
              frames: 19,
              issue: "Hospital load was moved to another Page and is missing from this Scene.",
              stage: "Sketch 006 · Stage 2 — Arrange and configure",
              focus: "Scene View · Missing chart"
            }
          ]
        }
      ];

      var EXTRA_NAMES = [
        "Weekly hospital readiness review",
        "Regional vaccination confidence pulse",
        "Public warning channel review",
        "Critical supplies continuity",
        "Municipality outbreak watch",
        "Population movement briefing",
        "Clinical staffing outlook",
        "Emergency department pressure",
        "Laboratory reporting cadence",
        "Community protection overview",
        "Outbreak and demand alignment",
        "Health-system resilience review",
        "Interagency situation update"
      ];

      function makeExtras() {
        var rows = [];
        for (var i = 0; i < 26; i += 1) {
          var page = PAGES[i % PAGES.length];
          var name = EXTRA_NAMES[i % EXTRA_NAMES.length] + " · " + String(i + 1).padStart(2, "0");
          rows.push({
            id: "extra-" + i,
            name: name,
            status: "ready",
            period: "1 Jan–31 Dec 2026",
            charts: 2 + (i % 5),
            frames: 8 + (i % 18),
            saved: (2 + (i % 12)) + " Aug · " + String(8 + (i % 9)).padStart(2, "0") + ":20",
            issues: [],
            scenes: i % 4 === 0 ? [] : [
              {
                id: "extra-scene-" + i,
                name: name.replace("review", "briefing").replace("overview", "scene"),
                page: page,
                status: "ready",
                charts: 1 + (i % 4),
                frames: 6 + (i % 16),
                issue: ""
              },
              ...(i % 5 === 0 ? [{
                id: "extra-scene-b-" + i,
                name: "Focused " + page.toLowerCase() + " handover",
                page: page,
                status: "ready",
                charts: 2,
                frames: 9,
                issue: ""
              }] : [])
            ]
          });
        }
        return rows;
      }

      var state = {
        variant: "D",
        viewport: "fit",
        mode: "build",
        libraryOpen: true,
        query: "",
        statusFilter: "all",
        pageFilter: "all",
        shelfPage: "Executive surveillance",
        expanded: new Set(["winter", "may-tempo"]),
        selected: "march",
        removed: new Set(),
        repaired: new Set(),
        addedGroups: [],
        addedScenes: [],
        handoff: null,
        activeDraft: null,
        pendingRequest: null,
        dialog: null,
        trueEmpty: false,
        libraryScroll: 0,
        toast: "",
        lastFocus: "time-content",
        sequence: 1
      };

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function statusOf(item) {
        return state.repaired.has(item.id) ? "ready" : item.status;
      }

      function groupsAll() {
        if (state.trueEmpty) return [];
        var groups = BASE_GROUPS.concat(makeExtras(), state.addedGroups);
        return groups.filter(function (group) { return !state.removed.has(group.id); }).map(function (group) {
          var extraScenes = state.addedScenes.filter(function (scene) { return scene.parentId === group.id && !state.removed.has(scene.id); });
          var scenes = group.scenes.concat(extraScenes).filter(function (scene) { return !state.removed.has(scene.id); });
          return Object.assign({}, group, { scenes: scenes });
        });
      }

      function groupById(id) {
        return groupsAll().find(function (group) { return group.id === id; }) || null;
      }

      function sceneById(id) {
        var found = null;
        groupsAll().some(function (group) {
          var scene = group.scenes.find(function (entry) { return entry.id === id; });
          if (scene) {
            found = { scene: scene, group: group };
            return true;
          }
          return false;
        });
        return found;
      }

      function searchText(group) {
        var pieces = [group.name, group.period];
        group.issues.forEach(function (issue) { pieces.push(issue.title, issue.detail); });
        group.scenes.forEach(function (scene) { pieces.push(scene.name, scene.page, scene.issue); });
        return pieces.join(" ").toLowerCase();
      }

      function visibleGroups() {
        var query = state.query.trim().toLowerCase();
        return groupsAll().filter(function (group) {
          if (query && searchText(group).indexOf(query) === -1) return false;
          if (state.statusFilter === "ready") {
            if (statusOf(group) !== "ready" && !group.scenes.some(function (scene) { return statusOf(scene) === "ready"; })) return false;
          }
          if (state.statusFilter === "attention") {
            if (statusOf(group) !== "attention" && !group.scenes.some(function (scene) { return statusOf(scene) === "attention"; })) return false;
          }
          if (state.pageFilter !== "all") {
            if (!group.scenes.some(function (scene) { return scene.page === state.pageFilter; })) return false;
          }
          return true;
        });
      }

      function statusPill(status, label) {
        var text = label || (status === "attention" ? "Needs attention" : status === "ready" ? "Ready" : "No Scenes");
        return '<span class="status-pill ' + esc(status) + '">' + esc(text) + '</span>';
      }

      function viewportStyle() {
        var map = {
          "1440": ["1440px", "900px"],
          "1200": ["1200px", "900px"],
          "1024": ["1024px", "768px"],
          "768": ["768px", "1024px"],
          "390": ["390px", "844px"]
        };
        if (state.viewport === "fit") return 'class="product-window fit"';
        var size = map[state.viewport];
        return 'class="product-window' + (state.viewport === "390" ? " phone" : "") + '" style="--vw:' + size[0] + ';--vh:' + size[1] + '"';
      }

      function reviewButton(value, label, detail) {
        return '<button class="review-button" type="button" data-action="variant" data-value="' + value + '" aria-pressed="' + (state.variant === value) + '" data-focus-key="variant-' + value + '"><strong>' + label + '</strong><span>' + detail + '</span></button>';
      }

      function viewportButton(value, label) {
        return '<button class="review-button" type="button" data-action="viewport" data-value="' + value + '" aria-pressed="' + (state.viewport === value) + '" data-focus-key="viewport-' + value + '"><strong>' + label + '</strong></button>';
      }

      function renderReviewRail() {
        return '<aside class="review-rail" aria-label="Sketch review controls">' +
          '<p class="review-kicker">Sketch 012 · Approved</p>' +
          '<h1>Temporal content library</h1>' +
          '<p class="review-summary">Compare how builders browse parent Time Groups, page-scoped Scenes, and blocked content without creating a second temporal editor.</p>' +
          '<section class="review-block"><h2>Variants</h2><div class="review-stack">' +
            reviewButton("A", "A · Relationship Ledger", "Preserved alternative · parent-first expansion") +
            reviewButton("B", "B · Page-first Scene Shelf", "Preserved alternative · split Scene shelf and group index") +
            reviewButton("C", "C · Attention Queue", "Preserved alternative · repair-first catalogue") +
            reviewButton("D", "D · Page-grouped Relationships ★ Winner", "Approved · page first · parent groups · three-across Scenes") +
          '</div></section>' +
          '<section class="review-block"><h2>Viewport</h2><div class="review-inline">' +
            viewportButton("fit", "Fit") + viewportButton("1440", "1440") + viewportButton("1200", "1200") +
            viewportButton("1024", "1024") + viewportButton("768", "768") + viewportButton("390", "390") +
          '</div></section>' +
          '<section class="review-block"><h2>Exercise states</h2><div class="review-stack">' +
            '<button class="review-button" type="button" data-action="review-open" data-focus-key="review-open"><strong>' + (state.libraryOpen ? "Close Time content" : "Open Time content") + '</strong><span>Product entry remains in the Build strip.</span></button>' +
            '<button class="review-button" type="button" data-action="true-empty" aria-pressed="' + state.trueEmpty + '" data-focus-key="true-empty"><strong>True-empty catalogue</strong><span>Distinct from a filtered no-results state.</span></button>' +
            '<button class="review-button" type="button" data-action="reset" data-focus-key="reset"><strong>Reset shared fixture</strong><span>32 groups · 40+ explicit Scenes · one state across variants.</span></button>' +
          '</div></section>' +
          '<section class="review-block"><h2>Fixed boundary</h2><p class="review-note">The library may route to Sketch 005 or 006, but it never embeds period, availability, frame, matching, twin-canvas, or Unit Orbit controls. Needs-attention objects remain inspectable and manageable while Chrono and Audience launch are blocked.</p></section>' +
        '</aside>';
      }

      function renderCrown() {
        var phoneBanner = state.viewport === "390" && state.mode !== "view" ?
          '<div class="unsupported-banner" role="status"><span>Build is not supported at phone size. View remains available.</span><button type="button" data-action="switch-view">Switch to View</button></div>' : "";
        return phoneBanner +
          '<header class="command-crown">' +
            '<div class="modebar">' +
              '<div class="identity"><span class="identity-mark">SX</span><span>SimEx dashboards</span></div>' +
              '<nav class="mode-actions" aria-label="Product mode">' +
                '<button class="mode-button" type="button" data-action="mode" data-value="view" aria-pressed="' + (state.mode === "view") + '">View</button>' +
                '<button class="mode-button" type="button" data-action="mode" data-value="build" aria-pressed="' + (state.mode === "build") + '">Build</button>' +
                '<button class="mode-button" type="button" data-action="mode" data-value="present" aria-pressed="' + (state.mode === "present") + '">Present</button>' +
              '</nav>' +
            '</div>' +
            '<div class="context-row">' +
              '<div><div class="dashboard-name">Regional Respiratory Preparedness</div><small>Europe/Berlin · saved dashboard</small></div>' +
              '<nav class="page-nav" aria-label="Dashboard pages">' +
                PAGES.map(function (page, index) { return '<button class="page-button" type="button" aria-current="' + (index === 0 ? "page" : "false") + '">' + esc(page) + '</button>'; }).join("") +
              '</nav>' +
            '</div>' +
            '<div class="build-strip">' +
              '<span class="strip-label">Build · structure clean · layout clean</span>' +
              '<button class="strip-button" type="button">Add chart</button>' +
              '<button class="strip-button" type="button">Add section</button>' +
              '<button class="strip-button" type="button">Dashboard look</button>' +
              '<button class="strip-button primary" type="button" data-action="time-content" aria-pressed="' + state.libraryOpen + '" data-focus-key="time-content">Time content</button>' +
            '</div>' +
          '</header>';
      }

      function miniBars(seed) {
        var heights = [42, 68, 53, 82, 61, 91, 73, 88];
        return heights.map(function (height, i) {
          var adjusted = Math.max(22, Math.min(96, height - ((seed + i * 7) % 20)));
          return '<span style="height:' + adjusted + '%"></span>';
        }).join("");
      }

      function renderDashboard() {
        return '<main class="dashboard-canvas"' + (state.libraryOpen ? ' aria-hidden="true" inert' : "") + '>' +
          '<div class="dashboard-heading"><div><h2>Executive surveillance</h2><p>National indicators, outbreak distribution, and health-system pressure.</p></div><span class="status-pill ready">Data current · 16 Aug 2026</span></div>' +
          '<section><div class="section-heading"><h3>Transmission and demand</h3><button type="button">Move earlier</button><button type="button">Move later</button><button type="button">Move to page</button><button type="button">Remove</button></div>' +
          '<div class="chart-grid">' +
            '<article class="chart-card"><h4>Confirmed cases</h4><p>79,547 cumulative</p><div class="mini-chart">' + miniBars(1) + '</div></article>' +
            '<article class="chart-card"><h4>Regional R values</h4><p>Median 1.08 · six regions</p><div class="mini-chart">' + miniBars(7) + '</div></article>' +
            '<article class="chart-card wide"><h4>Municipality outbreak map</h4><p>18 municipalities · 4 elevated</p><div class="mini-chart">' + miniBars(11) + '</div></article>' +
          '</div></section>' +
          '<section><div class="section-heading"><h3>Health-system readiness</h3><button type="button">Move earlier</button><button type="button">Move later</button><button type="button">Move to page</button><button type="button">Remove</button></div>' +
          '<div class="chart-grid">' +
            '<article class="chart-card wide"><h4>Hospital load</h4><p>ICU 72% · staffed capacity 81%</p><div class="mini-chart">' + miniBars(17) + '</div></article>' +
            '<article class="chart-card"><h4>Vaccination rate</h4><p>Primary series 83.4%</p><div class="mini-chart">' + miniBars(23) + '</div></article>' +
            '<article class="chart-card"><h4>Regional comparison</h4><p>Four-week change</p><div class="mini-chart">' + miniBars(31) + '</div></article>' +
          '</div></section>' +
        '</main>';
      }

      function blockedButton(label, reason) {
        return '<button class="action-button" type="button" aria-disabled="true" data-action="blocked" data-reason="' + esc(reason) + '">' + esc(label) + '</button>';
      }

      function handoffButton(label, kind, id, stage, focus, purpose, extraClass) {
        return '<button class="action-button ' + (extraClass || "") + '" type="button" data-action="request-handoff" data-kind="' + esc(kind) + '" data-id="' + esc(id) + '" data-stage="' + esc(stage) + '" data-focus="' + esc(focus || "") + '" data-purpose="' + esc(purpose || "edit") + '">' + esc(label) + '</button>';
      }

      function groupActions(group) {
        var status = statusOf(group);
        var launch = status === "ready" ?
          '<button class="action-button" type="button" data-action="launch" data-label="Opened ' + esc(group.name) + ' in View Chrono">Open in Chrono</button>' :
          blockedButton("Open in Chrono", group.name + " cannot start Chrono until its Needs-attention findings are repaired.");
        return '<div class="record-actions">' +
          launch +
          handoffButton("Edit", "Time Group", group.id, "Sketch 005 · Name and review", "Saved Time Group summary", "edit") +
          handoffButton("Duplicate", "Time Group", group.id, "Sketch 005 · Name and review", "Duplicate draft with new Group and child Scene IDs", "duplicate") +
          '<button class="action-button danger" type="button" data-action="remove" data-kind="group" data-id="' + esc(group.id) + '">Remove</button>' +
        '</div>';
      }

      function sceneActions(scene, group) {
        var status = statusOf(scene);
        var launch = status === "ready" ?
          '<button class="action-button" type="button" data-action="launch" data-label="Opened ' + esc(scene.name) + ' in View Chrono">Open in Chrono</button>' :
          blockedButton("Open in Chrono", scene.name + " cannot start Chrono or reach Audience until repaired. " + scene.issue);
        var repair = status === "attention" ?
          handoffButton("Repair", "Scene", scene.id, scene.stage || "Sketch 006 · Stage 1 — Select charts and frames", scene.focus || "Affected Scene control", "repair", "repair") : "";
        return '<div class="scene-actions">' +
          repair + launch +
          handoffButton("Edit", "Scene", scene.id, "Sketch 006 · Stage 1 — Select charts and frames", "Saved Scene scope", "edit") +
          handoffButton("Duplicate", "Scene", scene.id, "Sketch 006 · Stage 1 — Select charts and frames", "Duplicate under " + group.name + " on " + scene.page, "duplicate") +
          '<button class="action-button danger" type="button" data-action="remove" data-kind="scene" data-id="' + esc(scene.id) + '">Remove</button>' +
        '</div>';
      }

      function issueRows(group) {
        if (statusOf(group) !== "attention" || !group.issues.length) return "";
        return '<div class="issue-list">' + group.issues.map(function (issue) {
          return '<div class="issue-row"><div><strong>' + esc(issue.title) + '</strong><span>' + esc(issue.detail) + '</span></div>' +
            handoffButton("Repair", "Time Group", group.id, issue.stage, issue.focus, "repair", "repair") + '</div>';
        }).join("") + '</div>';
      }

      function sceneCard(scene, group) {
        var status = statusOf(scene);
        return '<article class="scene-card ' + (state.selected === scene.id ? "selected" : "") + '" data-object-id="' + esc(scene.id) + '">' +
          '<div><button class="record-title" type="button" data-action="select" data-id="' + esc(scene.id) + '" data-focus-key="select-' + esc(scene.id) + '">' +
            '<h4>' + esc(scene.name) + '</h4></button>' +
            '<p>Child of <strong>' + esc(group.name) + '</strong>' + (scene.issue ? " · " + esc(scene.issue) : "") + '</p>' +
            '<div class="record-metadata">' + statusPill(status) + '<span class="page-chip">' + esc(scene.page) + '</span><span class="count-chip">' + scene.charts + ' charts</span><span class="count-chip">' + scene.frames + ' frames</span></div>' +
          '</div>' + sceneActions(scene, group) +
        '</article>';
      }

      function groupRecord(group) {
        var expanded = state.expanded.has(group.id);
        var status = statusOf(group);
        var scenes = group.scenes;
        return '<article class="group-record ' + status + " " + (state.selected === group.id ? "selected" : "") + '" data-object-id="' + esc(group.id) + '">' +
          '<div class="group-head">' +
            '<button class="disclosure" type="button" data-action="toggle-group" data-id="' + esc(group.id) + '" aria-expanded="' + expanded + '" aria-label="' + (expanded ? "Collapse " : "Expand ") + esc(group.name) + '" data-focus-key="toggle-' + esc(group.id) + '">' + (expanded ? "−" : "+") + '</button>' +
            '<div><button class="record-title" type="button" data-action="select" data-id="' + esc(group.id) + '" data-focus-key="select-' + esc(group.id) + '"><strong>' + esc(group.name) + '</strong><span>Dashboard-wide Time Group · ' + esc(group.period) + '</span></button>' +
              '<div class="record-metadata">' + statusPill(status) + '<span class="count-chip">' + group.charts + ' charts</span><span class="count-chip">' + group.frames + ' default frames</span><span class="count-chip">' + scenes.length + ' Scene' + (scenes.length === 1 ? "" : "s") + '</span><span class="count-chip">Saved ' + esc(group.saved) + '</span></div>' +
            '</div>' + groupActions(group) +
          '</div>' +
          (expanded ? '<div class="group-details">' + issueRows(group) +
            (scenes.length ? '<div class="scene-list">' + scenes.map(function (scene) { return sceneCard(scene, group); }).join("") + '</div>' :
              '<div class="empty-state"><h3>No Scenes yet</h3><p>This ready Time Group remains usable in Default Chrono. Create a page-scoped Scene without changing its parent configuration.</p>' +
                handoffButton("Create Scene", "Scene", group.id, "Sketch 006 · Stage 1 — Select charts and frames", "Page first · parent preselected when compatible", "create-scene") + '</div>') +
          '</div>' : "") +
        '</article>';
      }

      function noResults() {
        var trueEmpty = groupsAll().length === 0;
        return '<div class="empty-state"><h3>' + (trueEmpty ? "No saved Time Groups" : "No temporal content matches") + '</h3>' +
          '<p>' + (trueEmpty ? "Create the first dashboard-wide Time Group, then add page-scoped Scenes from its saved membership." : "The saved library is unchanged. Clear the query or broaden the status and Page filters.") + '</p>' +
          (trueEmpty ? handoffButton("Create Time Group", "Time Group", "new", "Sketch 005 · Choose period", "New Time Group draft", "create-group") :
            '<button class="action-button" type="button" data-action="clear-filters">Clear filters</button>') +
        '</div>';
      }

      function renderLedger() {
        var groups = visibleGroups();
        if (!groups.length) return noResults();
        var sceneCount = groups.reduce(function (sum, group) { return sum + group.scenes.length; }, 0);
        return '<div class="summary-line"><strong>' + groups.length + ' Time Groups</strong><span>·</span><span>' + sceneCount + ' matching Scenes</span><span>·</span><span>Time Groups are dashboard-wide; every Scene keeps its Page label.</span></div>' +
          '<div class="ledger">' + groups.map(groupRecord).join("") + '</div>';
      }

      function renderShelfCard(scene, group) {
        var status = statusOf(scene);
        return '<article class="shelf-card ' + status + '">' +
          '<div><span class="parent-chip">Time Group · ' + esc(group.name) + '</span>' + statusPill(status) + '</div>' +
          '<h4>' + esc(scene.name) + '</h4><p>' + (scene.issue ? esc(scene.issue) : scene.charts + ' charts · ' + scene.frames + ' frames') + '</p>' +
          sceneActions(scene, group) +
        '</article>';
      }

      function renderShelfRelationship(group) {
        var status = statusOf(group);
        var pages = PAGES.map(function (page) {
          return { page: page, scenes: group.scenes.filter(function (scene) { return scene.page === page; }) };
        }).filter(function (entry) { return entry.scenes.length; });
        return '<section class="shelf-relationship" aria-labelledby="shelf-relationship-title-' + esc(group.id) + '">' +
          '<div class="relationship-head"><div><span class="relationship-kicker">Focused Time Group relationship</span>' +
            '<h3 id="shelf-relationship-title-' + esc(group.id) + '">' + esc(group.name) + '</h3>' +
            '<div class="record-metadata">' + statusPill(status) + '<span class="count-chip">' + esc(group.period) + '</span><span class="count-chip">' + group.charts + ' charts</span><span class="count-chip">' + group.frames + ' default frames</span><span class="count-chip">' + group.scenes.length + ' child Scene' + (group.scenes.length === 1 ? '' : 's') + '</span></div>' +
            groupActions(group) + '</div>' +
            '<button class="action-button relationship-close" type="button" data-action="clear-shelf-relationship" data-return-id="' + esc(group.id) + '" data-focus-key="relationship-close">Close relationship view</button></div>' +
          issueRows(group) +
          (pages.length ? '<div class="relationship-pages">' + pages.map(function (entry) {
            return '<section class="relationship-page" aria-label="' + esc(entry.page) + ' Scenes"><div class="relationship-page-head"><h4>' + esc(entry.page) + '</h4><span>' + entry.scenes.length + ' Scene' + (entry.scenes.length === 1 ? '' : 's') + '</span></div>' +
              '<div class="relationship-scenes">' + entry.scenes.map(function (scene) {
                var sceneStatus = statusOf(scene);
                return '<article class="relationship-scene ' + sceneStatus + '"><div>' + statusPill(sceneStatus) + '<h5>' + esc(scene.name) + '</h5><p>' + (scene.issue ? esc(scene.issue) : scene.charts + ' charts · ' + scene.frames + ' frames') + '</p></div>' + sceneActions(scene, group) + '</article>';
              }).join('') + '</div></section>';
          }).join('') + '</div>' : '<div class="empty-state"><h3>No child Scenes</h3><p>This Time Group is ready for Default Chrono and can become the parent of a new page-scoped Scene.</p>' + handoffButton('Create Scene', 'Scene', group.id, 'Sketch 006 · Stage 1 — Select charts and frames', 'Page first · parent preselected when compatible', 'create-scene') + '</div>') +
        '</section>';
      }

      function renderShelf() {
        var groups = visibleGroups();
        if (!groups.length) return noResults();
        var relationshipGroup = groupById(state.selected);
        var scenes = [];
        groups.forEach(function (group) {
          group.scenes.forEach(function (scene) {
            if (scene.page === state.shelfPage) scenes.push({ scene: scene, group: group });
          });
        });
        return '<div class="summary-line"><strong>Page-first retrieval</strong><span>·</span><span>Every Scene still names its parent Time Group.</span></div>' +
          '<div class="shelf-layout">' +
            (relationshipGroup ? renderShelfRelationship(relationshipGroup) : '') +
            '<section class="page-shelf" aria-labelledby="page-shelf-title">' +
              '<div class="shelf-tabs" role="tablist" aria-label="Scene pages">' +
                PAGES.map(function (page) { return '<button class="shelf-tab" type="button" data-action="shelf-page" data-value="' + esc(page) + '" aria-pressed="' + (state.shelfPage === page) + '">' + esc(page) + '</button>'; }).join("") +
              '</div>' +
              '<div class="shelf-heading"><h3 id="page-shelf-title">' + esc(state.shelfPage) + '</h3><span>' + scenes.length + ' Scenes</span></div>' +
              (scenes.length ? '<div class="shelf-cards">' + scenes.map(function (entry) { return renderShelfCard(entry.scene, entry.group); }).join("") + '</div>' :
                '<div class="empty-state"><h3>No Scenes on this Page</h3><p>Parent Time Groups remain dashboard-wide in the adjacent group index.</p></div>') +
            '</section>' +
            '<aside class="group-rail" aria-labelledby="group-index-title"><div class="rail-heading"><h3 id="group-index-title">Time Group index</h3><span>Dashboard-wide</span></div>' +
              '<div class="group-rail-list">' + groups.slice(0, 12).map(function (group) {
                return '<article class="rail-record ' + (state.selected === group.id ? 'selected' : '') + '">' + statusPill(statusOf(group)) + '<strong>' + esc(group.name) + '</strong><span>' + group.scenes.length + ' Scenes across ' + new Set(group.scenes.map(function (scene) { return scene.page; })).size + ' Pages</span>' +
                  '<div class="record-actions"><button class="action-button" type="button" data-action="select-group-from-rail" data-id="' + esc(group.id) + '" data-focus-key="relationship-' + esc(group.id) + '">View Time Group &amp; Scenes</button>' +
                  handoffButton("Create Scene", "Scene", group.id, "Sketch 006 · Stage 1 — Select charts and frames", "Page first · parent selected second", "create-scene") + '</div></article>';
              }).join("") + '</div>' +
            '</aside>' +
          '</div>';
      }

      function queueItem(kind, item, group, issue) {
        var title = kind === "Time Group" ? item.name : item.name;
        var reason = issue ? issue.title : item.issue;
        var stage = issue ? issue.stage : (item.stage || "Sketch 006 · Stage 1 — Select charts and frames");
        var focus = issue ? issue.focus : (item.focus || "Affected control");
        return '<article class="queue-item"><div><div class="record-metadata"><span class="parent-chip">' + esc(kind) + '</span>' +
          (kind === "Scene" ? '<span class="page-chip">' + esc(item.page) + '</span><span class="parent-chip">Parent · ' + esc(group.name) + '</span>' : "") +
          '</div><h4>' + esc(title) + '</h4><p>' + esc(reason) + '</p></div>' +
          '<div class="queue-actions">' + blockedButton("Open in Chrono", "Repair is required before playback or Audience output.") +
          handoffButton("Repair", kind, item.id, stage, focus, "repair", "repair") + '</div></article>';
      }

      function renderQueue() {
        var groups = visibleGroups();
        if (!groups.length) return noResults();
        var attention = [];
        var ready = [];
        groups.forEach(function (group) {
          if (statusOf(group) === "attention") {
            if (group.issues.length) group.issues.forEach(function (issue) { attention.push(queueItem("Time Group", group, group, issue)); });
            else attention.push(queueItem("Time Group", group, group, { title: "This Time Group needs repair.", stage: "Sketch 005 · Name and review", focus: "Saved summary" }));
          } else ready.push({ kind: "Time Group", item: group, group: group });
          group.scenes.forEach(function (scene) {
            if (statusOf(scene) === "attention") attention.push(queueItem("Scene", scene, group));
            else ready.push({ kind: "Scene", item: scene, group: group });
          });
        });
        return '<div class="queue-layout">' +
          '<section class="attention-queue" aria-labelledby="attention-title"><div class="queue-heading"><h3 id="attention-title">Needs attention</h3><span>' + attention.length + ' repair findings · playback blocked only for affected objects</span></div>' +
            (attention.length ? '<div class="queue-list">' + attention.join("") + '</div>' :
              '<div class="empty-state"><h3>No repairs needed</h3><p>The Ready library remains available below; an empty queue is not an empty catalogue.</p></div>') +
          '</section>' +
          '<section class="ready-catalogue" aria-labelledby="ready-title"><div class="queue-heading"><h3 id="ready-title">Ready library</h3><span>' + ready.length + ' saved objects</span></div>' +
            '<div class="ready-grid">' + ready.slice(0, 18).map(function (entry) {
              var item = entry.item;
              return '<article class="ready-card">' + statusPill("ready") + '<h4>' + esc(item.name) + '</h4><p>' + (entry.kind === "Scene" ? esc(item.page) + ' · Child of ' + esc(entry.group.name) : 'Dashboard-wide Time Group · ' + item.scenes.length + ' Scenes') + '</p>' +
                '<div class="record-actions">' +
                  '<button class="action-button" type="button" data-action="launch" data-label="Opened ' + esc(item.name) + ' in View Chrono">Open</button>' +
                  handoffButton("Edit", entry.kind, item.id, entry.kind === "Scene" ? "Sketch 006 · Stage 1 — Select charts and frames" : "Sketch 005 · Name and review", "Saved summary", "edit") +
                '</div></article>';
            }).join("") + '</div>' +
          '</section>' +
        '</div>';
      }

      function renderPageGrouped() {
        var groups = visibleGroups();
        if (!groups.length) return noResults();
        var entries = groups.map(function (group, groupIndex) {
          var scenes = group.scenes.map(function (scene, sceneIndex) {
            return { scene: scene, sceneIndex: sceneIndex, attention: statusOf(scene) === "attention" };
          }).filter(function (entry) { return entry.scene.page === state.shelfPage; });
          if (!scenes.length) return null;
          scenes.sort(function (a, b) { return Number(b.attention) - Number(a.attention) || a.sceneIndex - b.sceneIndex; });
          var attentionScenes = scenes.filter(function (entry) { return entry.attention; }).length;
          return {
            group: group,
            groupIndex: groupIndex,
            scenes: scenes,
            attentionScenes: attentionScenes,
            elevated: statusOf(group) === "attention" || attentionScenes > 0
          };
        }).filter(Boolean);
        entries.sort(function (a, b) { return Number(b.elevated) - Number(a.elevated) || a.groupIndex - b.groupIndex; });
        var elevatedCount = entries.filter(function (entry) { return entry.elevated; }).length;
        return '<div class="page-grouped-library">' +
          '<div class="summary-line"><strong>' + esc(state.shelfPage) + '</strong><span>·</span><span>' + entries.length + ' Time Groups</span><span>·</span><span>' + elevatedCount + ' elevated for attention</span></div>' +
          '<div class="shelf-tabs" role="tablist" aria-label="Time Groups by Scene Page">' +
            PAGES.map(function (page) { return '<button class="shelf-tab" type="button" data-action="shelf-page" data-value="' + esc(page) + '" aria-pressed="' + (state.shelfPage === page) + '">' + esc(page) + '</button>'; }).join("") +
          '</div>' +
          (entries.length ? '<div class="page-group-list">' + entries.map(function (entry) {
            var group = entry.group;
            var priority = statusOf(group) === "attention" ? "Time Group needs attention" : entry.attentionScenes + ' Scene' + (entry.attentionScenes === 1 ? '' : 's') + ' need attention';
            return '<section class="page-group-block ' + (entry.elevated ? 'elevated' : '') + '" aria-labelledby="page-group-' + esc(group.id) + '">' +
              '<div class="page-group-header"><div>' + (entry.elevated ? '<span class="priority-label">Elevated · ' + esc(priority) + '</span>' : '') +
                '<h3 id="page-group-' + esc(group.id) + '">' + esc(group.name) + '</h3><p>Dashboard-wide Time Group · ' + esc(group.period) + '</p>' +
                '<div class="record-metadata">' + statusPill(statusOf(group)) + '<span class="count-chip">' + entry.scenes.length + ' Scene' + (entry.scenes.length === 1 ? '' : 's') + ' on this Page</span><span class="count-chip">' + group.scenes.length + ' total Scenes</span><span class="count-chip">' + group.charts + ' charts</span><span class="count-chip">' + group.frames + ' default frames</span></div></div>' +
                groupActions(group) + '</div>' + issueRows(group) +
              '<div class="page-group-scenes">' + entry.scenes.map(function (sceneEntry) {
                var scene = sceneEntry.scene;
                var sceneStatus = statusOf(scene);
                return '<article class="page-group-scene ' + sceneStatus + '">' + statusPill(sceneStatus) + '<h4>' + esc(scene.name) + '</h4><p>' + (scene.issue ? esc(scene.issue) : 'Child Scene in ' + esc(scene.page)) + '</p>' +
                  '<div class="record-metadata"><span class="count-chip">' + scene.charts + ' charts</span><span class="count-chip">' + scene.frames + ' frames</span></div>' + sceneActions(scene, group) + '</article>';
              }).join("") + '</div></section>';
          }).join("") + '</div>' : '<div class="empty-state"><h3>No Time Groups with Scenes on this Page</h3><p>The saved library is unchanged. Choose another Page or broaden the shared filters.</p></div>') +
        '</div>';
      }

      function renderFilters() {
        var activeDraft = state.activeDraft ? '<span class="draft-chip">Active temporal draft · ' + esc(state.activeDraft.label) + '</span>' : '<span class="draft-chip" style="border-color:var(--rule);background:var(--panel);color:var(--muted)">No temporal draft open</span>';
        return '<div class="library-subhead"><span class="variant-name">' + (state.variant === "A" ? "A · Relationship Ledger" : state.variant === "B" ? "B · Page-first Scene Shelf" : state.variant === "C" ? "C · Attention Queue" : "D · Page-grouped Relationships") + '</span><span>One saved-content projection · one shared session</span>' + activeDraft + '</div>' +
          '<div class="filter-bar">' +
            '<div class="field"><label for="library-search">Search saved temporal content</label><input id="library-search" type="search" value="' + esc(state.query) + '" placeholder="Group, Scene, Page, chart, or issue" data-action="query" data-focus-key="search"></div>' +
            '<div class="field"><label for="status-filter">Status</label><select id="status-filter" data-action="status-filter" data-focus-key="status-filter"><option value="all"' + (state.statusFilter === "all" ? " selected" : "") + '>All statuses</option><option value="ready"' + (state.statusFilter === "ready" ? " selected" : "") + '>Ready</option><option value="attention"' + (state.statusFilter === "attention" ? " selected" : "") + '>Needs attention</option></select></div>' +
            '<div class="field"><label for="page-filter">Scene Page</label><select id="page-filter" data-action="page-filter" data-focus-key="page-filter"><option value="all"' + (state.pageFilter === "all" ? " selected" : "") + '>All Pages</option>' + PAGES.map(function (page) { return '<option value="' + esc(page) + '"' + (state.pageFilter === page ? " selected" : "") + '>' + esc(page) + '</option>'; }).join("") + '</select></div>' +
            '<button class="primary filter-action" type="button" data-action="create-group" data-focus-key="create-group">Create Time Group</button>' +
          '</div>';
      }

      function renderHandoff() {
        var handoff = state.handoff;
        if (!handoff) return "";
        var object = handoff.kind === "Time Group" ? groupById(handoff.id) : sceneById(handoff.id);
        var objectName = handoff.id === "new" ? "New Time Group" : handoff.kind === "Time Group" ? (object ? object.name : handoff.label) : (object ? object.scene.name : handoff.label);
        var parent = handoff.kind === "Scene" && object ? object.group.name : "Dashboard-wide";
        return '<div class="handoff-panel" aria-label="Approved authoring workflow handoff">' +
          '<div class="handoff-head"><p>' + esc(handoff.kind) + ' authoring handoff</p><h3>' + esc(objectName) + '</h3></div>' +
          '<div class="handoff-body"><p>This library routes to the approved authoring owner. It does not reproduce its controls.</p>' +
            '<div class="handoff-stage"><strong>' + esc(handoff.stage) + '</strong><span>Focus target · ' + esc(handoff.focus || "Saved summary") + '</span></div>' +
            '<div class="handoff-proof">' +
              '<div class="proof-card"><strong>Object identity</strong><span>' + esc(handoff.kind) + ' · ' + esc(objectName) + '</span></div>' +
              '<div class="proof-card"><strong>Relationship retained</strong><span>' + esc(parent) + '</span></div>' +
              '<div class="proof-card"><strong>Return context</strong><span>Variant ' + state.variant + ', query, filters, expansion, scroll, and focus retained.</span></div>' +
            '</div>' +
          '</div>' +
          '<div class="handoff-actions"><button type="button" data-action="handoff-return">Cancel and return to library</button><button class="primary" type="button" data-action="handoff-save">Simulate Save and return</button></div>' +
        '</div>';
      }

      function renderLibraryBody() {
        if (state.handoff) return renderHandoff();
        if (state.variant === "A") return renderLedger();
        if (state.variant === "B") return renderShelf();
        if (state.variant === "C") return renderQueue();
        return renderPageGrouped();
      }

      function renderModal() {
        if (!state.dialog) return "";
        if (state.dialog.type === "draft-conflict") {
          return '<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
            '<div class="modal-head"><h3 id="modal-title">Another temporal draft is already open</h3></div>' +
            '<div class="modal-body"><p><strong>' + esc(state.activeDraft.label) + '</strong> must be resolved before starting <strong>' + esc(state.pendingRequest.label) + '</strong>.</p><p>The requested action and current library position will be retained.</p></div>' +
            '<div class="modal-actions"><button type="button" data-action="modal-cancel">Cancel</button><button type="button" data-action="return-active">Return to active draft</button><button type="button" data-action="discard-active">Discard active and continue</button><button class="primary" type="button" data-action="save-active">Save active and continue</button></div>' +
          '</section></div>';
        }
        var target = state.dialog.kind === "group" ? groupById(state.dialog.id) : sceneById(state.dialog.id);
        if (!target) return "";
        if (state.dialog.kind === "group") {
          var childNames = target.scenes.map(function (scene) { return '<li>' + esc(scene.name) + ' · ' + esc(scene.page) + '</li>'; }).join("");
          return '<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="remove-title">' +
            '<div class="modal-head"><h3 id="remove-title">Remove Time Group?</h3></div><div class="modal-body"><p><strong>' + esc(target.name) + '</strong> and every child Scene will be removed from the saved dashboard.</p>' +
            (childNames ? '<ul class="consequence-list">' + childNames + '</ul>' : '<p class="empty-state">This Time Group has no child Scenes.</p>') +
            '<p>Charts, data, Pages, and any currently running View/Present session remain unchanged.</p></div>' +
            '<div class="modal-actions"><button type="button" data-action="modal-cancel">Cancel</button><button class="danger" type="button" data-action="confirm-remove">Remove Time Group and named Scenes</button></div></section></div>';
        }
        return '<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="remove-title">' +
          '<div class="modal-head"><h3 id="remove-title">Remove Scene?</h3></div><div class="modal-body"><p>Remove <strong>' + esc(target.scene.name) + '</strong> from <strong>' + esc(target.group.name) + '</strong>?</p><p>The parent Time Group, sibling Scenes, charts, and live sessions remain unchanged.</p></div>' +
          '<div class="modal-actions"><button type="button" data-action="modal-cancel">Cancel</button><button class="danger" type="button" data-action="confirm-remove">Remove Scene only</button></div></section></div>';
      }

      function renderLibrary() {
        if (!state.libraryOpen || state.mode !== "build") return "";
        var totalGroups = groupsAll().length;
        var totalScenes = groupsAll().reduce(function (sum, group) { return sum + group.scenes.length; }, 0);
        return '<div class="library-backdrop" aria-hidden="true"></div>' +
          '<section class="library-layer" role="dialog" aria-modal="true" aria-labelledby="library-title">' +
            '<header class="library-header"><div class="library-title"><p class="library-kicker">Saved temporal content</p><h2 id="library-title">Time Groups and Scenes</h2><p>Find relationships, understand readiness, and route to the approved authoring owner.</p></div>' +
              '<div class="header-actions"><button class="primary" type="button" data-action="create-group">Create Time Group</button><button type="button" data-action="close-library" data-focus-key="close-library">Close</button></div></header>' +
            renderFilters() +
            '<div class="library-scroll" data-scroll-owner="library">' + renderLibraryBody() + '</div>' +
            '<footer class="library-footer"><span><strong>' + totalGroups + '</strong> saved Time Groups · <strong>' + totalScenes + '</strong> child Scenes · saved content is independent from live Chrono and Present sessions.</span><button type="button" data-action="close-library">Return to Build</button></footer>' +
          '</section>' + renderModal() + (state.toast ? '<div class="toast" role="status">' + esc(state.toast) + '</div>' : "");
      }

      function renderProduct() {
        return '<div ' + viewportStyle() + '><div class="product-scroll">' + renderCrown() + renderDashboard() + renderLibrary() + '<div class="sr-only" role="status" aria-live="polite" id="live-status">' + esc(state.toast) + '</div></div></div>';
      }

      function render(focusKey) {
        var previousScroll = document.querySelector(".library-scroll");
        if (previousScroll) state.libraryScroll = previousScroll.scrollTop;
        var active = document.activeElement;
        var key = focusKey || (active && active.dataset ? active.dataset.focusKey : "") || state.lastFocus;
        document.getElementById("app").innerHTML = '<div class="prototype">' + renderReviewRail() + '<main class="stage"><div class="viewport-frame">' + renderProduct() + '</div></main></div>';
        var scroll = document.querySelector(".library-scroll");
        if (scroll) scroll.scrollTop = state.libraryScroll;
        if (key) {
          requestAnimationFrame(function () {
            var target = document.querySelector('[data-focus-key="' + CSS.escape(key) + '"]');
            if (target) {
              target.focus({ preventScroll: true });
              if (target.matches("input")) {
                var len = target.value.length;
                target.setSelectionRange(len, len);
              }
            }
          });
        }
        if (state.toast) {
          window.clearTimeout(render.toastTimer);
          render.toastTimer = window.setTimeout(function () {
            state.toast = "";
            render();
          }, 2600);
        }
      }

      function handoffPayload(button) {
        var id = button.dataset.id;
        var kind = button.dataset.kind;
        var object = kind === "Time Group" ? groupById(id) : sceneById(id);
        var label = id === "new" ? "New Time Group draft" : kind === "Time Group" ? (object ? object.name : id) : (object ? object.scene.name : id);
        return {
          kind: kind,
          id: id,
          label: label,
          stage: button.dataset.stage,
          focus: button.dataset.focus,
          purpose: button.dataset.purpose || "edit"
        };
      }

      function requestHandoff(payload) {
        if (state.activeDraft) {
          state.pendingRequest = payload;
          state.dialog = { type: "draft-conflict" };
        } else {
          state.handoff = payload;
        }
        render();
      }

      function simulateSave(handoff) {
        if (handoff.purpose === "repair") state.repaired.add(handoff.id);
        if (handoff.purpose === "create-group") {
          var id = "created-group-" + state.sequence++;
          state.addedGroups.unshift({
            id: id,
            name: "New Time Group " + state.sequence,
            status: "ready",
            period: "1 Jan–31 Mar 2027",
            charts: 2,
            frames: 8,
            saved: "Just now",
            issues: [],
            scenes: []
          });
          state.expanded.add(id);
          state.selected = id;
        }
        if (handoff.purpose === "duplicate" && handoff.kind === "Time Group") {
          var source = groupById(handoff.id);
          if (source) {
            var newGroupId = "copy-group-" + state.sequence++;
            state.addedGroups.unshift(Object.assign({}, source, {
              id: newGroupId,
              name: "Copy of " + source.name,
              saved: "Just now",
              scenes: source.scenes.map(function (scene) {
                return Object.assign({}, scene, { id: "copy-scene-" + state.sequence++ + "-" + scene.id, name: "Copy of " + scene.name });
              })
            }));
            state.expanded.add(newGroupId);
            state.selected = newGroupId;
          }
        }
        if ((handoff.purpose === "duplicate" || handoff.purpose === "create-scene") && handoff.kind === "Scene") {
          var sourceScene = sceneById(handoff.id);
          var parentId = handoff.purpose === "create-scene" ? handoff.id : (sourceScene ? sourceScene.group.id : "winter");
          var source = sourceScene ? sourceScene.scene : null;
          var newSceneId = "created-scene-" + state.sequence++;
          state.addedScenes.unshift({
            id: newSceneId,
            parentId: parentId,
            name: source ? "Copy of " + source.name : "New Scene " + state.sequence,
            page: source ? source.page : "Executive surveillance",
            status: "ready",
            charts: source ? source.charts : 2,
            frames: source ? source.frames : 8,
            issue: ""
          });
          state.expanded.add(parentId);
          state.selected = newSceneId;
        }
        state.toast = handoff.purpose === "repair" ? "Repair saved. The object is Ready; library context retained." : "Saved through the approved authoring owner; library context retained.";
      }

      function clearFilters() {
        state.query = "";
        state.statusFilter = "all";
        state.pageFilter = "all";
      }

      document.addEventListener("input", function (event) {
        if (event.target.dataset.action === "query") {
          state.query = event.target.value;
          render("search");
        }
      });

      document.addEventListener("change", function (event) {
        if (event.target.dataset.action === "status-filter") {
          state.statusFilter = event.target.value;
          state.libraryScroll = 0;
          render("status-filter");
        }
        if (event.target.dataset.action === "page-filter") {
          state.pageFilter = event.target.value;
          state.libraryScroll = 0;
          render("page-filter");
        }
      });

      document.addEventListener("click", function (event) {
        var button = event.target.closest("button");
        if (!button) return;
        var action = button.dataset.action;
        if (!action) return;
        state.lastFocus = button.dataset.focusKey || state.lastFocus;

        if (action === "variant") {
          state.variant = button.dataset.value;
          render("variant-" + state.variant);
          return;
        }
        if (action === "viewport") {
          state.viewport = button.dataset.value;
          render("viewport-" + state.viewport);
          return;
        }
        if (action === "review-open" || action === "time-content") {
          state.libraryOpen = !state.libraryOpen;
          if (state.libraryOpen) state.mode = "build";
          render(action === "time-content" ? "time-content" : "review-open");
          return;
        }
        if (action === "close-library") {
          state.libraryOpen = false;
          render("time-content");
          return;
        }
        if (action === "mode") {
          var nextMode = button.dataset.value;
          if (state.activeDraft && nextMode !== "build") {
            state.toast = "The active temporal draft stays in Build. Resolve it before leaving.";
          } else {
            state.mode = nextMode;
            if (nextMode !== "build") state.libraryOpen = false;
          }
          render();
          return;
        }
        if (action === "switch-view") {
          state.mode = "view";
          state.libraryOpen = false;
          state.toast = "Switched to supported phone View. Temporal state retained.";
          render();
          return;
        }
        if (action === "true-empty") {
          state.trueEmpty = !state.trueEmpty;
          state.libraryScroll = 0;
          render("true-empty");
          return;
        }
        if (action === "reset") {
          var variant = state.variant;
          var viewport = state.viewport;
          state = {
            variant: variant, viewport: viewport, mode: "build", libraryOpen: true, query: "", statusFilter: "all", pageFilter: "all",
            shelfPage: "Executive surveillance", expanded: new Set(["winter", "may-tempo"]), selected: "march", removed: new Set(),
            repaired: new Set(), addedGroups: [], addedScenes: [], handoff: null, activeDraft: null, pendingRequest: null, dialog: null,
            trueEmpty: false, libraryScroll: 0, toast: "Shared fixture reset.", lastFocus: "reset", sequence: 1
          };
          render("reset");
          return;
        }
        if (action === "toggle-group") {
          var groupId = button.dataset.id;
          if (state.expanded.has(groupId)) state.expanded.delete(groupId); else state.expanded.add(groupId);
          render("toggle-" + groupId);
          return;
        }
        if (action === "select") {
          state.selected = button.dataset.id;
          render("select-" + button.dataset.id);
          return;
        }
        if (action === "shelf-page") {
          state.shelfPage = button.dataset.value;
          render();
          return;
        }
        if (action === "select-group-from-rail") {
          state.selected = button.dataset.id;
          state.libraryScroll = 0;
          render("relationship-close");
          return;
        }
        if (action === "clear-shelf-relationship") {
          var returnId = button.dataset.returnId;
          state.selected = "";
          render("relationship-" + returnId);
          return;
        }
        if (action === "clear-filters") {
          clearFilters();
          render("search");
          return;
        }
        if (action === "create-group") {
          requestHandoff({ kind: "Time Group", id: "new", label: "New Time Group draft", stage: "Sketch 005 · Choose period", focus: "Inclusive period in Europe/Berlin", purpose: "create-group" });
          return;
        }
        if (action === "request-handoff") {
          requestHandoff(handoffPayload(button));
          return;
        }
        if (action === "handoff-return") {
          state.activeDraft = { label: state.handoff.label, handoff: state.handoff, valid: true };
          state.handoff = null;
          state.toast = "Authoring suspended. The active temporal draft is retained.";
          render();
          return;
        }
        if (action === "handoff-save") {
          simulateSave(state.handoff);
          state.handoff = null;
          state.activeDraft = null;
          render();
          return;
        }
        if (action === "return-active") {
          state.handoff = state.activeDraft.handoff;
          state.dialog = null;
          state.pendingRequest = null;
          render();
          return;
        }
        if (action === "discard-active" || action === "save-active") {
          var requested = state.pendingRequest;
          state.toast = action === "save-active" ? "Active draft saved; requested action opened." : "Active draft discarded; requested action opened.";
          state.activeDraft = null;
          state.pendingRequest = null;
          state.dialog = null;
          state.handoff = requested;
          render();
          return;
        }
        if (action === "modal-cancel") {
          state.dialog = null;
          state.pendingRequest = null;
          render(state.lastFocus);
          return;
        }
        if (action === "remove") {
          state.dialog = { type: "remove", kind: button.dataset.kind, id: button.dataset.id };
          render();
          requestAnimationFrame(function () {
            var cancel = document.querySelector('[data-action="modal-cancel"]');
            if (cancel) cancel.focus();
          });
          return;
        }
        if (action === "confirm-remove") {
          var removedDialog = state.dialog;
          if (removedDialog.kind === "group") {
            var removedGroup = groupById(removedDialog.id);
            if (removedGroup) removedGroup.scenes.forEach(function (scene) { state.removed.add(scene.id); });
            state.removed.add(removedDialog.id);
            state.toast = "Time Group and its named child Scenes removed. Charts and live sessions unchanged.";
          } else {
            state.removed.add(removedDialog.id);
            state.toast = "Scene removed. Parent Time Group and sibling Scenes unchanged.";
          }
          state.dialog = null;
          render();
          return;
        }
        if (action === "blocked") {
          state.toast = button.dataset.reason;
          render();
          return;
        }
        if (action === "launch") {
          state.toast = button.dataset.label + ". The saved library did not change.";
          render();
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          if (state.dialog) {
            state.dialog = null;
            state.pendingRequest = null;
            render(state.lastFocus);
          } else if (state.handoff) {
            state.activeDraft = { label: state.handoff.label, handoff: state.handoff, valid: true };
            state.handoff = null;
            state.toast = "Authoring suspended; draft retained.";
            render();
          } else if (state.libraryOpen) {
            state.libraryOpen = false;
            render("time-content");
          }
          return;
        }
        if (event.key === "Tab" && (state.dialog || state.libraryOpen)) {
          var scope = state.dialog ? document.querySelector(".modal") : document.querySelector(".library-layer");
          if (!scope) return;
          var focusable = Array.from(scope.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex="0"]')).filter(function (node) {
            return node.offsetParent !== null;
          });
          if (!focusable.length) return;
          var first = focusable[0];
          var last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });

      render();
    })();
  </script>
</body>
</html>
